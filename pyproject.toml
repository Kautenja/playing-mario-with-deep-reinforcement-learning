[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playing-mario-with-deep-reinforcement-learning"
version = "6.0.0.dev1"
description = "Modern reinforcement learning experiments for Super Mario Bros."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Christian Kauten", email = "kautencreations@gmail.com"},
]
keywords = [
    "Gymnasium",
    "Super-Mario-Bros",
    "Reinforcement-Learning",
    "Deep-Q-Learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.3.0,<2.0.0",
    "gym-super-mario-bros>=9.1.0,<10.0.0",
    "nes-py>=9.0.0,<10.0.0",
    "torch>=2.12.0",
    "lightning>=2.6.5",
    "tensorboard>=2.20.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "Pillow>=12.2.0",
    "pandas>=3.0.3",
    "matplotlib>=3.10.9",
    "tqdm>=4.68.2",
    "PyYAML>=6.0.3",
    "jsonargparse[signatures]>=4.49.0",
]

[project.urls]
Homepage = "https://github.com/Kautenja/playing-mario-with-deep-reinforcement-learning"
Repository = "https://github.com/Kautenja/playing-mario-with-deep-reinforcement-learning"

[tool.setuptools.packages.find]
include = ["mario_rl*"]
exclude = ["src", "src.*"]

[tool.setuptools.package-data]
mario_rl = ["config/data/*.yaml", "configs/**/*.yaml", "configs/**/*.yml", "data/**/*"]
