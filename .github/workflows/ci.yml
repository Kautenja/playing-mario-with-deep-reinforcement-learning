name: CI

'on':
  pull_request:
  push:
    branches:
      - master
      - pytorch
    tags:
      - '*'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'
          - '3.14'
        platform:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15

    steps:
      - name: Check out Mario RL source
        uses: actions/checkout@v6
        with:
          path: playing-mario-with-deep-reinforcement-learning

      - name: Check out nes-py source
        uses: actions/checkout@v6
        with:
          repository: Kautenja/nes-py
          ref: master
          path: nes-py

      - name: Check out gym-super-mario-bros source
        uses: actions/checkout@v6
        with:
          repository: Kautenja/gym-super-mario-bros
          ref: master
          path: gym-super-mario-bros

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg g++ libgl1 libglib2.0-0
          g++ --version
          ffmpeg -version

      - name: Configure macOS test dependencies
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          clang++ --version
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version

      - name: Install package stack
        working-directory: playing-mario-with-deep-reinforcement-learning
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install --editable ../nes-py --config-settings=editable.mode=inplace
          python -m pip install --editable ../gym-super-mario-bros
          python -m pip install --editable .
          python -m pip check

      - name: Run tests
        working-directory: playing-mario-with-deep-reinforcement-learning
        run: python -m unittest discover .

      - name: Build distributions
        working-directory: playing-mario-with-deep-reinforcement-learning
        run: python -m build
