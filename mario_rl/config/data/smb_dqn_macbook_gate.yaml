experiment_name: smb_dqn_macbook_gate
save_dir: runs
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  deterministic: true
  seed: 123
  enable_progress_bar: false
env:
  id: SuperMarioBros-1-1-v0
  render_mode: null
  action_set: simple
  seed: 123
  image_size: [40, 40]
  frame_stack: 4
  reward_clipping: true
  frame_skip: 4
  preprocess: true
  grayscale: true
  channel_first: true
  interpolation: area
  record_statistics: true
  video_enabled: false
  video_dir: null
  video_length: 0
  video_name_prefix: mario-rl-macbook-gate
  max_smoke_steps: 16
replay:
  capacity: 64
  batch_size: 2
  warmup: 2
  prioritized: false
  priority_alpha: 0.6
  priority_beta: 0.4
  sample_dtype: uint8
  state_shape: [4, 40, 40]
model:
  architecture: dqn
  input_channels: 4
  hidden_size: 64
  optimizer: adam
  learning_rate: 0.00025
  discount_factor: 0.99
  double_dqn: true
  target_update_frequency: 4
  compile: false
  num_actions: 7
epsilon:
  start: 1.0
  final: 0.1
  decay_frames: 32
train:
  max_frames: 32
  max_steps: 8
  fast_dev_run: true
  log_interval: 1
  checkpoint_path: null
  accelerator: cpu
  devices: 1
  output_dir_name: checkpoints
  checkpoint_name: macbook-gate.ckpt
  resolved_config_name: resolved-config.yaml
  metrics_name: train-metrics.csv
eval:
  checkpoint: null
  episodes: 1
  max_steps: 8
  deterministic: true
  metrics_name: eval-metrics.json
  video_name: eval.mp4
