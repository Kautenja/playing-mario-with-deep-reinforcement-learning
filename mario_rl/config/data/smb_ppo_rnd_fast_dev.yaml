experiment_name: smb_ppo_rnd_fast_dev
save_dir: runs
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  deterministic: true
  seed: 123
env:
  id: SuperMarioBros-1-1-v0
  render_mode: rgb_array
  action_set: complex
  seed: 123
  pixel_profile: grayscale_84
  image_size: [84, 84]
  frame_stack: 4
  reward_clipping: false
  frame_skip: 4
  preprocess: true
  grayscale: true
  channel_first: true
  interpolation: area
  record_statistics: true
  max_episode_steps: 4000
  no_progress_timeout_steps: 600
  stuck_penalty: 0.01
  video_enabled: false
  video_dir: null
  video_length: 0
  video_name_prefix: mario-rl-ppo-rnd-fast-dev
  max_smoke_steps: 32
reward_transform:
  mode: env
  missing_total_policy: error
  component_weights: {}
  missing_component_policy: zero
exploration:
  enabled: true
  method: rnd
  intrinsic_reward_scale: 0.05
  predictor_learning_rate: 0.0001
  normalize_observations: true
  normalize_intrinsic_rewards: true
  intrinsic_reward_clip: 1.0
  warmup_steps: 0
  warmup_reward_scale: 0.0
  log_intrinsic_rewards: true
  rnd_embedding_size: 32
  rnd_hidden_size: 64
  observation_source: next_observation
task_suite:
  enabled: true
  mode: adaptive
  game_families: [smb1, lost_levels, smb3]
  single_stage: true
  splits: [train]
  exclude_splits: []
  include_validated: true
  exclude_validated: null
  include_aliases: false
  include_env_ids: [SuperMarioBros-1-1-v0, SuperMarioBros-1-2-v0, SuperMarioBros3-1-1-v0, SuperMarioBros2-1-1-v0]
  exclude_env_ids: []
  include_worlds: []
  exclude_worlds: []
  include_stages: []
  exclude_stages: []
  family_weights: {}
  seed: 123
  switch_interval_episodes: 1
  curriculum_frontier_size: 1
  curriculum_mastery_window: 5
  curriculum_mastery_min_episodes: 3
  curriculum_mastery_clear_rate: 0.8
  curriculum_mastery_death_rate: 0.25
  curriculum_mastery_progress: null
  curriculum_lost_levels_prerequisite_family: smb1
  curriculum_state_path: null
replay:
  capacity: 1024
  batch_size: 8
  warmup: 8
  prioritized: false
  priority_alpha: 0.6
  priority_beta: 0.4
  sample_dtype: uint8
  state_shape: [4, 84, 84]
  store_reward_info: true
model:
  architecture: recurrent_actor_critic
  input_channels: 4
  hidden_size: 256
  recurrent_hidden_size: 128
  task_embedding_size: 32
  optimizer: adam
  learning_rate: 0.00025
  discount_factor: 0.99
  double_dqn: true
  target_update_frequency: 128
  compile: false
  num_actions: auto
  task_conditioning: true
  task_feature_size: 0
ppo:
  num_envs: 2
  rollout_steps: 8
  minibatch_size: 4
  epochs: 1
  gae_lambda: 0.95
  clip_range: 0.2
  value_loss_coefficient: 0.5
  entropy_coefficient: 0.01
  normalize_advantages: true
  max_grad_norm: 0.5
epsilon:
  start: 1.0
  final: 0.1
  decay_frames: 1000
train:
  algorithm: ppo
  max_frames: 32
  max_steps: 2
  fast_dev_run: true
  log_interval: 1
  checkpoint_path: null
  accelerator: cpu
  devices: 1
  output_dir_name: checkpoints
  checkpoint_name: ppo-rnd-fast-dev.ckpt
  resolved_config_name: resolved-config.yaml
  metrics_name: train-metrics.csv
eval:
  checkpoint: null
  episodes: 1
  max_steps: 32
  deterministic: true
  metrics_name: eval-metrics.json
  video_name: eval.mp4
