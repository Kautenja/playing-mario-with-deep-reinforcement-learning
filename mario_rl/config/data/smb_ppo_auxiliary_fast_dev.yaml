experiment_name: smb_ppo_auxiliary_fast_dev
save_dir: runs
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  deterministic: true
  seed: 123
  enable_progress_bar: false
env:
  id: SuperMarioBros-1-1-v0
  render_mode: null
  action_set: complex
  seed: 123
  pixel_profile: custom
  image_size: [40, 40]
  frame_stack: 4
  reward_clipping: false
  frame_skip: 4
  preprocess: true
  grayscale: true
  channel_first: true
  interpolation: area
  record_statistics: true
  max_episode_steps: 4000
  no_progress_timeout_steps: 600
  stuck_penalty: 0.01
  video_enabled: false
  video_dir: null
  video_length: 0
  video_name_prefix: mario-rl-ppo-auxiliary-fast-dev
  max_smoke_steps: 16
reward_transform:
  mode: env
  missing_total_policy: error
  component_weights: {}
  missing_component_policy: zero
auxiliary:
  enabled: true
  targets: [progress_delta, clear, death, transformed_reward, game_family]
  weights:
    progress_delta: 0.1
    clear: 0.25
    death: 0.25
    transformed_reward: 0.1
    game_family: 0.5
  head_hidden_size: 32
replay:
  capacity: 64
  batch_size: 2
  warmup: 2
  prioritized: false
  priority_alpha: 0.6
  priority_beta: 0.4
  sample_dtype: uint8
  state_shape: [4, 40, 40]
  store_reward_info: true
model:
  architecture: recurrent_actor_critic
  input_channels: 4
  hidden_size: 64
  recurrent_hidden_size: 32
  task_embedding_size: 16
  optimizer: adam
  learning_rate: 0.00025
  discount_factor: 0.99
  double_dqn: true
  target_update_frequency: 4
  compile: false
  num_actions: auto
  task_conditioning: true
  task_feature_size: 0
ppo:
  rollout_steps: 4
  minibatch_size: 2
  epochs: 1
  gae_lambda: 0.95
  clip_range: 0.2
  value_loss_coefficient: 0.5
  entropy_coefficient: 0.01
  normalize_advantages: true
  max_grad_norm: 0.5
epsilon:
  start: 1.0
  final: 0.1
  decay_frames: 32
train:
  algorithm: ppo
  max_frames: 16
  max_steps: 2
  fast_dev_run: true
  log_interval: 1
  checkpoint_path: null
  accelerator: cpu
  devices: 1
  output_dir_name: checkpoints
  checkpoint_name: ppo-auxiliary-fast-dev.ckpt
  resolved_config_name: resolved-config.yaml
  metrics_name: train-metrics.csv
eval:
  checkpoint: null
  episodes: 1
  max_steps: 8
  deterministic: true
  metrics_name: eval-metrics.json
  video_name: eval.mp4
