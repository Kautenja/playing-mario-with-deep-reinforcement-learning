experiment_name: smb_dqn_prioritized_fast_dev
save_dir: runs
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  deterministic: true
  seed: 123
env:
  id: SuperMarioBros-1-1-v0
  render_mode: rgb_array
  action_set: complex
  seed: 123
  pixel_profile: grayscale_84
  image_size: [84, 84]
  frame_stack: 4
  reward_clipping: false
  frame_skip: 4
  preprocess: true
  grayscale: true
  channel_first: true
  interpolation: area
  record_statistics: true
  max_episode_steps: 4000
  no_progress_timeout_steps: 600
  stuck_penalty: 0.01
  video_enabled: false
  video_dir: null
  video_length: 0
  video_name_prefix: mario-rl-prioritized-fast-dev
  max_smoke_steps: 32
reward_transform:
  mode: env
  missing_total_policy: error
  component_weights: {}
  missing_component_policy: zero
replay:
  capacity: 1024
  batch_size: 8
  warmup: 8
  prioritized: true
  priority_alpha: 0.6
  priority_beta: 0.4
  sample_dtype: uint8
  state_shape: [4, 84, 84]
  store_reward_info: true
model:
  architecture: dqn
  input_channels: 4
  hidden_size: 512
  optimizer: adam
  learning_rate: 0.00025
  discount_factor: 0.99
  double_dqn: true
  target_update_frequency: 128
  compile: false
  num_actions: auto
epsilon:
  start: 1.0
  final: 0.1
  decay_frames: 1000
train:
  max_frames: 128
  max_steps: 32
  fast_dev_run: true
  log_interval: 8
  checkpoint_path: null
  accelerator: cpu
  devices: 1
  output_dir_name: checkpoints
  checkpoint_name: prioritized-fast-dev.ckpt
  resolved_config_name: resolved-config.yaml
  metrics_name: train-metrics.csv
eval:
  checkpoint: null
  episodes: 1
  max_steps: 32
  deterministic: true
  metrics_name: eval-metrics.json
  video_name: eval.mp4
